<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поток — ui kit</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cg%20clip-path%3D%22url%28%23a%29%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%23173B57%22/%3E%3Cpath%20d%3D%22M21.5451%2022.9397V9.11304H10.4167V22.9397H12.8451V11.1346H19.1167V22.9397H21.5451Z%22%20fill%3D%22%23F3F3F3%22/%3E%3C/g%3E%3Cdefs%3E%3CclipPath%20id%3D%22a%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22white%22/%3E%3C/clipPath%3E%3C/defs%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --dipe:#10273D; --breakwater:#173B57; --tiffany:#04CCD9; --red:#EE3D48; --yellow:#FFC11E;
  --white:#FFFFFF; --bg:#F2F4F8; --dividers:#E8ECF0; --input:#DCE0E3; --grey:#818E99;
  --purple:#9B51E0; --orange:#F6522E; --tag-grey:#E8EBEE;
  --font:"Suisse Intl","Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--dipe);background:var(--white);font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit}

/* type tokens */
.h1{font-size:30px;line-height:36px;font-weight:500;letter-spacing:-.01em}
.h2{font-size:20px;line-height:26px;font-weight:500;letter-spacing:-.01em}
.b1{font-size:16px;line-height:24px;font-weight:400}
.b11{font-size:16px;line-height:24px;font-weight:500}
.b2{font-size:14px;line-height:22px;font-weight:400}
.b21{font-size:14px;line-height:22px;font-weight:500}
.b3{font-size:12px;line-height:20px;font-weight:400;letter-spacing:-.01em}
.up{font-size:8px;line-height:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.grey{color:var(--grey)}

/* ===== layout ===== */
.top{position:fixed;inset:0 0 auto 0;height:80px;background:var(--white);border-bottom:1px solid var(--dividers);display:flex;align-items:center;gap:20px;padding:0 50px;z-index:20}
.logo{display:inline-flex;align-items:center}
.burger{display:none;border:0;background:var(--bg);border-radius:8px;width:44px;height:44px;cursor:pointer;font-size:16px;color:var(--dipe)}

/* side menu — как side menu кита: контейнер с отступом 10, пункты 56 / поля 20 / радиус 8 / body 1, активный — background */
.side{position:fixed;top:80px;bottom:0;left:0;width:300px;overflow:auto;border-right:1px solid var(--dividers);padding:10px 10px 50px;background:var(--white);z-index:10}
.side .grp{padding:30px 20px 10px;color:var(--grey);font-size:8px;line-height:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.side .grp:first-child{padding-top:20px}
.side a{display:flex;align-items:center;height:56px;padding:0 20px;border-radius:8px;text-decoration:none;color:var(--dipe);font-size:16px;line-height:24px}
.side a.on{background:var(--bg)}

.main{margin-left:300px;padding:80px 0 0}
.wrap{display:flex;gap:50px;max-width:1340px;padding:70px 70px 100px}
.content{flex:1;min-width:0;max-width:960px}
.toc{width:180px;flex:none;position:sticky;top:150px;align-self:flex-start;border-left:1px solid var(--dividers);padding-left:14px}
.toc div{color:var(--grey);font-size:8px;line-height:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.toc a{display:block;text-decoration:none;color:var(--grey);font-size:14px;line-height:22px;padding:4px 0}
.toc a:hover{color:var(--dipe)}

/* ===== doc typography & spacing (шкала: 6 / 8 / 10 / 14 / 20 / 30 / 50 / 70 / 100) ===== */
.content > *{margin-top:0;margin-bottom:0}
.content h1{font-size:30px;line-height:36px;font-weight:500;letter-spacing:-.01em}
.content h1 + *{margin-top:20px}
.content h2{font-size:20px;line-height:26px;font-weight:500;letter-spacing:-.01em;margin-top:100px;scroll-margin-top:110px}
.content h3{font-size:16px;line-height:24px;font-weight:500;margin-top:30px}
.content p{font-size:16px;line-height:24px}
.content > * + *{margin-top:30px}
.content > h2 + *{margin-top:30px}
.content > h2 + p,.content > h3 + p,.content > p + p,.content > h3 + ul,.content > p + ul{margin-top:14px}
.content > .meta{margin-top:20px}
.lead{color:var(--grey);font-size:16px;line-height:24px;max-width:720px}
.content ul.dots{padding-left:20px;font-size:16px;line-height:24px}
.content ul.dots li + li{margin-top:6px}
.meta{display:flex;gap:20px;flex-wrap:wrap}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
code{background:var(--bg);border-radius:4px;padding:1px 6px}

/* demo box */
.demos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:30px}
.demos.one{grid-template-columns:1fr}
.box{border:1px solid var(--dividers);border-radius:14px;overflow:hidden;background:var(--white);display:flex;flex-direction:column}
.box .stage{flex:1 1 auto}
.box .cap{flex:none}
.demos>.box{display:grid;grid-template-rows:subgrid;grid-row:span 2;row-gap:0}
.demos{row-gap:30px}
.box .stage{padding:20px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;min-height:100px}
.box .stage.col{flex-direction:column;align-items:flex-start;gap:14px}
.box .stage.bg{background:var(--bg)}
.box .cap{border-top:1px solid var(--dividers);padding:20px}
.box .cap b{display:block;font-weight:500;font-size:14px;line-height:22px}
.box .cap span{display:block;color:var(--grey);font-size:14px;line-height:22px}
.box .cap span:not(:empty){margin-top:6px}

.do-dont{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:30px}
.rule{border-radius:14px;background:var(--bg);overflow:hidden;display:grid;grid-template-rows:subgrid;grid-row:span 2;row-gap:0}
.rule .stage{padding:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center;min-height:120px}
.rule .txt{padding:20px;border-top:3px solid var(--tiffany);background:var(--white);font-size:14px;line-height:22px}
.rule.bad .txt{border-top-color:var(--red)}
.rule .txt b{display:block;font-weight:500;margin-bottom:6px}
.rule.good .txt b{color:#00A3AE}.rule.bad .txt b{color:var(--red)}

/* spec table = table кита: белая, радиус 14; шапка 40, поля 30, uppercase 8 grey, фон dividers 30%; строки 60, поля 20, радиус 10, body 1, разделитель dividers */
.tablebox{background:#fff;border:1px solid var(--dividers);border-radius:14px;overflow:hidden;padding:0 10px 10px}
table.spec{width:100%;border-collapse:separate;border-spacing:0}
table.spec th{height:40px;padding:0 20px;text-align:left;font-size:8px;line-height:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);background:rgba(232,236,240,.3)}
table.spec tr:first-child th:first-child{box-shadow:-10px 0 0 rgba(232,236,240,.3)}
table.spec tr:first-child th:last-child{box-shadow:10px 0 0 rgba(232,236,240,.3)}
table.spec td{padding:18px 20px;font-size:16px;line-height:24px;color:var(--dipe);vertical-align:middle;border-bottom:1px solid var(--dividers)}
table.spec tr:last-child td{border-bottom:0}

.codebox{position:relative;background:var(--dipe);color:#CFE3F2;border-radius:14px;padding:20px;overflow:auto}
.codebox pre{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:20px}
.copy{position:absolute;top:20px;right:20px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:8px;padding:6px 14px;font-size:14px;cursor:pointer}
.copy:hover{background:rgba(255,255,255,.1)}
.toast{position:fixed;top:100px;right:30px;background:var(--white);border-left:3px solid var(--tiffany);box-shadow:0 10px 30px rgba(16,39,61,.12);border-radius:8px;padding:14px 20px;z-index:50;opacity:0;transform:translateY(-6px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.card{background:var(--bg);border-radius:14px;padding:20px;text-decoration:none;display:block}
.card .h2{margin-bottom:20px}
.search{height:44px;border-radius:8px;border:1px solid var(--input);background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}
.search input{border:0;background:transparent;outline:0;font:inherit;font-size:16px;color:var(--dipe);width:100%}
.search input::placeholder{color:var(--grey)}

/* ===== POTOK COMPONENTS ===== */
.ic{display:inline-block;vertical-align:middle;flex:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:8px;border:1px solid transparent;font:400 16px/24px var(--font);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s;min-width:117px}
.btn.l{height:60px;padding:0 30px;min-width:160px}
.btn.s{height:32px;padding:0 14px;font-size:14px;min-width:0}
.btn.primary{background:var(--breakwater);border-color:var(--breakwater);color:#fff}
.btn.primary:hover,.btn.primary.h{background:transparent;color:var(--breakwater)}
.btn.secondary{background:transparent;border-color:var(--breakwater);color:var(--breakwater)}
.btn.secondary:hover,.btn.secondary.h{background:var(--breakwater);color:#fff}
.btn.tertiary{background:transparent;border-color:var(--input);color:var(--dipe)}
.btn.tertiary:hover,.btn.tertiary.h{background:var(--dividers);border-color:var(--dividers)}
.btn.lock,.btn.busy{cursor:default}
.btn.primary.busy,.btn.primary.busy:hover{background:var(--breakwater);color:#fff}
.btn.primary.lock,.btn.primary.lock:hover{background:#2E5170;border-color:#2E5170;color:#fff}
.btn.secondary.lock,.btn.secondary.lock:hover{background:transparent;border-color:#5D7589;color:#5D7589}
.btn.primary.off:hover{background:#2E5170;border-color:#2E5170}
.btn.primary.off{background:#2E5170;border-color:#2E5170;color:rgba(255,255,255,.5);cursor:default}
.btn.fluid{width:100%}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(129,142,153,.35);border-top-color:currentColor;animation:r .9s linear infinite;display:inline-block}
@keyframes r{to{transform:rotate(360deg)}}
.lnk{display:inline-flex;align-items:center;gap:6px;color:var(--grey);text-decoration:none;cursor:pointer;font:400 16px/24px var(--font);background:none;border:0;padding:0}
.lnk:hover,.lnk.dark{color:var(--dipe)}
.lnk.arr{color:var(--dipe)}
.lnk.arr:hover{color:var(--grey)}
.lnk.arr{gap:8px}
.lnk.t{color:var(--tiffany)}.lnk.t:hover{color:#00A3AE}
.lnk.red{color:var(--red)}
.ibtn{width:36px;height:36px;border-radius:8px;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer}
.chat{width:44px;height:44px;border-radius:50%;background:var(--breakwater);display:inline-flex;align-items:center;justify-content:center}

/* inputs — по input / 60 и input / 44 кита */
.field{position:relative;width:340px;max-width:100%}
.inp{width:100%;height:60px;border-radius:8px;background:var(--bg);border:1px solid var(--bg);padding:0 20px 0 19px;font:400 16px/24px var(--font);color:var(--dipe);outline:0;cursor:text}
.inp::placeholder{color:var(--grey)}
.inp:focus,.inp.act{border-color:rgba(23,59,87,.1)}
.inp.err{border-color:rgba(238,61,72,.1)}
.inp[disabled]{color:var(--grey);cursor:default}
.inp[readonly]{cursor:pointer}
.field .after{position:absolute;right:20px;top:30px;transform:translateY(-50%);pointer-events:none;display:flex}
.field .errtxt{color:var(--red);font:400 16px/24px var(--font);margin-top:10px}
.field.m{padding-top:6px}
.field.m .inp{height:44px;background:transparent;border-color:var(--input);padding:0 16px}
.field.m .inp.err{border-color:var(--red)}
.field.m .after{right:16px;top:28px}
.field.m .lbl{position:absolute;left:12px;top:0;background:#fff;padding:0 4px;color:var(--grey);font-size:8px;line-height:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;opacity:0;pointer-events:none}
.field.m.has .lbl,.field.m:focus-within .lbl{opacity:1}
.field.m.nolbl .lbl{display:none}
.field.m.nolbl{padding-top:0}
.field.m.nolbl .after{top:22px}
.field.open .ddl{display:flex}
.ddl{background:#fff;border-radius:12px;padding:14px 10px 10px;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 22px rgba(13,39,65,.12);width:340px;max-width:100%}
.field .ddl{display:none;position:absolute;left:0;top:calc(100% + 10px);z-index:5}
.ddl a{display:flex;align-items:center;gap:10px;height:44px;padding:10px;border-radius:8px;font:400 16px/24px var(--font);color:var(--dipe);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddl a:hover,.ddl a.on{background:var(--bg)}
.code{display:flex;gap:20px}
.code input{width:70px;height:60px;text-align:center;font:500 30px/36px var(--font);border-radius:8px;border:1px solid var(--bg);background:var(--bg);color:var(--dipe);outline:0;padding:0}
.code input:focus,.code input.act{border-color:rgba(23,59,87,.1)}
.code.e input{border-color:rgba(238,61,72,.1)}
.box .stage.tall{align-items:flex-start}
.box .stage.tall .field .ddl{position:static;margin-top:10px}

/* checkbox / radio / toggle */
.chk{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:14px}
.chk input{display:none}
.chk .bx{width:20px;height:20px;border-radius:4px;background:var(--dividers);display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.chk:hover .bx{background:var(--input)}
.chk input:checked + .bx{background:var(--dipe)}
.chk input:checked + .bx::after{content:"";width:6px;height:6px;border-radius:1.5px;background:#fff}
.chk .bx.mid{background:var(--grey)}.chk .bx.mid::after{content:"";width:6px;height:6px;border-radius:1.5px;background:#fff}
.chk.rd .bx{border-radius:50%}
.chk.rd input:checked + .bx::after{border-radius:50%}
.tg{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:14px}
.tg input{display:none}
.tg .tr{width:34px;height:20px;border-radius:10px;background:var(--dividers);position:relative;transition:.15s;flex:none}
.tg .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,39,61,.2);transition:.15s}
.tg input:checked + .tr{background:var(--dipe)}
.tg input:checked + .tr::after{left:16px}

/* tabs */
.tabs{display:flex;gap:30px;box-shadow:inset 0 -1px 0 var(--input);width:100%}
.tabs.nob{box-shadow:none;width:auto}
.tabs button{border:0;background:none;padding:0 0 12px;font:400 14px/22px var(--font);color:var(--grey);cursor:pointer;position:relative;white-space:nowrap}
.tabs button:hover,.tabs button.hv{color:var(--breakwater)}
.tabs button.on{color:var(--dipe)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--dipe)}
.ttabs{display:flex;gap:20px;flex-wrap:wrap}
.ttabs button{border:0;background:none;padding:0 0 10px;font:500 30px/36px var(--font);letter-spacing:-.01em;color:var(--grey);cursor:pointer;position:relative}
.ttabs button.on{color:var(--dipe)}
.ttabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--dipe)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:6px 16px;border-radius:8px;border:0;background:var(--bg);color:var(--dipe);font:400 14px/22px var(--font);cursor:pointer}
.chip.on{background:var(--breakwater);color:#fff}
.seg{display:inline-flex}
.seg button{position:relative;border:1px solid var(--breakwater);margin-left:-1px;background:#fff;padding:6px 24px;font:400 14px/22px var(--font);color:var(--breakwater);cursor:pointer;white-space:nowrap}
.seg button:first-child{margin-left:0;border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{z-index:1;background:var(--breakwater);color:#fff}
.seg.lite button{border-color:var(--input);background:none;padding:8px 9px 10px;font:400 16px/24px var(--font);color:var(--grey)}
.seg.lite button:hover,.seg.lite button.hv{color:var(--breakwater)}
.seg.lite button.on{z-index:1;border-color:var(--dipe);color:var(--dipe)}
.seg .l{border-radius:8px 0 0 8px!important}.seg .m{border-radius:0!important}.seg .r{border-radius:0 8px 8px 0!important}
.sw{display:inline-flex;padding:5px;border-radius:22px;border:1px solid var(--input);gap:6px}
.sw.nob{border:0;padding:0;gap:16px;border-radius:0}
.sw button{border:0;background:none;padding:0 17px;height:32px;border-radius:16px;font:400 16px/24px var(--font);color:var(--grey);cursor:pointer;white-space:nowrap}
.sw button:hover,.sw button.hv{background:var(--bg)}
.sw button.on{background:var(--bg);color:var(--dipe)}

/* tags */
/* tag, status, level badge — по tags кита */
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:4px 8px;border-radius:6px;font-size:8px;line-height:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.tag.purple{background:rgba(155,81,224,.1);color:#9B51E0}
.tag.red{background:rgba(238,61,72,.1);color:#EE3D48}
.tag.tif{background:rgba(4,204,217,.1);color:#04CCD9}
.tag.orange{background:rgba(246,82,46,.1);color:#FF6B00}
.tag.neutral{background:rgba(23,59,87,.06);color:#10273D}
.tag.grey{background:#F2F4F8;color:#10273D}
.tag.greyd{background:#E8EBEE;color:#173B57}
.tag.line{background:transparent;box-shadow:inset 0 0 0 1px #DCE0E3;color:#10273D}
.stat{display:inline-flex;align-items:center;gap:6px;height:24px;padding:6px;border-radius:6px;font-size:8px;line-height:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:#F2F4F8;color:#818E99}
.stat::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.stat.on{background:rgba(4,204,217,.1);color:#04CCD9}
.lvl{display:inline-flex;align-items:center;gap:4px;height:24px;padding:6px 10px 6px 8px;border-radius:6px;border:1px solid currentColor;font-size:8px;line-height:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:transparent;cursor:default;white-space:nowrap}
.lvl.c1{color:#818E99}.lvl.c2{color:#F6522E}.lvl.c3{color:#173B57}.lvl.c4{color:#FFC11E}.lvl.c5{color:#04CCD9}.lvl.c6{color:#EE3D48}
.lvl:hover,.lvl.f{color:#fff}
.lvl.c1:hover,.lvl.f.c1{background:#818E99;border-color:#818E99}
.lvl.c2:hover,.lvl.f.c2{background:#F6522E;border-color:#F6522E}
.lvl.c3:hover,.lvl.f.c3{background:#173B57;border-color:#173B57}
.lvl.c4:hover,.lvl.f.c4{background:#FFC11E;border-color:#FFC11E}
.lvl.c5:hover,.lvl.f.c5{background:#04CCD9;border-color:#04CCD9}
.lvl.c6:hover,.lvl.f.c6{background:#EE3D48;border-color:#EE3D48}
.lvl.c4:hover svg path,.lvl.f.c4 svg path{stroke:#FFC11E}
.tagcolor{display:flex;align-items:center;gap:20px;font:400 14px/22px var(--font)}
.tagcolor i{width:100px;height:100px;border-radius:50%;display:block}

/* tooltip */
.tip{position:relative;display:inline-flex}
.tip .bub{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#fff;box-shadow:0 10px 30px rgba(16,39,61,.12);border-radius:8px;padding:10px 14px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
.tip:hover .bub,.tip .bub.show{opacity:1}
.tip.r .bub{bottom:auto;top:50%;left:calc(100% + 10px);transform:translateY(-50%)}

/* side menu */
.smenu{background:#fff;border-radius:14px;padding:10px;width:360px;max-width:100%}
.smenu a{display:flex;align-items:center;gap:16px;height:56px;padding:0 20px;border-radius:8px;text-decoration:none;font-size:16px;line-height:24px;cursor:pointer}

.yr{width:150px;height:70px;border-radius:6px;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font:400 20px/26px var(--font);color:var(--dipe);cursor:pointer}
.yr.on{background:rgba(4,204,217,.1);color:var(--tiffany)}
.dp .btns{border-top:1px solid var(--dividers);padding:15px 20px 20px;display:flex;gap:10px}
.dtp{width:352px;display:flex;flex-direction:column;gap:10px}
.dtp .dp{box-shadow:none}
.dtp .time{display:flex;gap:10px}
.dtp .field{width:100%}
.pswitch{display:inline-flex;gap:2px;border-radius:8px;overflow:hidden}
.pswitch>*{height:34px;background:var(--bg);display:flex;align-items:center;justify-content:center;border:0}
.pswitch button{width:34px;cursor:pointer}
.pswitch span{width:142px;gap:4px;font:400 14px/22px var(--font);color:var(--dipe)}
.ddl.w240{width:240px}

/* upload — по upload кита */
.fthumb{position:relative;width:60px;height:60px;border-radius:8px;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.fthumb.fb{box-shadow:inset 0 0 0 1px #E8ECF0}
.fthumb.e{background:rgba(238,61,72,.06);box-shadow:inset 0 0 0 1px rgba(238,61,72,.1)}
.fthumb .rm{position:absolute;left:50px;top:-6px;display:none;cursor:pointer}
.fthumb.ph:hover .rm,.fthumb.h .rm{display:flex}
.uspin{animation:r .9s linear infinite}
.fchip{position:relative;width:220px;height:60px;background:var(--bg);border-radius:8px;padding:10px;display:flex;align-items:center;gap:10px;flex:none}
.fchip .tile40{width:40px;height:40px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--dividers);display:flex;align-items:center;justify-content:center;flex:none}
.fchip .nm{font:400 12px/20px var(--font);color:var(--breakwater);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:150px}
.fchip .ext{font-size:8px;line-height:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.fchip .rm{position:absolute;left:209px;top:-4px;display:none;cursor:pointer}
.fchip:hover .rm,.fchip.h .rm{display:flex}
.tile{width:180px;height:204px;border-radius:14px;background:#fff;padding-top:36px;display:flex;flex-direction:column;align-items:center;gap:6px;font:400 14px/22px var(--font);color:var(--breakwater);text-align:center;cursor:pointer;flex:none}
.uarea{background:var(--bg);border-radius:14px;padding:20px;display:inline-flex;gap:20px;align-items:center}
.uhint{display:flex;gap:10px;font:400 14px/22px var(--font);color:var(--grey)}
.uhint::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--grey);margin-top:9px;flex:none}
.uhints{width:340px;display:flex;flex-direction:column;gap:10px;padding-top:10px}
.ulist{width:560px;max-width:100%;background:var(--bg);border-radius:14px;padding:10px 20px 20px}
.urow{position:relative;display:flex;align-items:center;gap:20px;padding:20px 20px 20px 10px}
.urow::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:1px;background:var(--dividers)}
.urow:has(+ .ufoot)::after{display:none}
.urow .cnt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.urow .nm{font:400 16px/24px var(--font);color:var(--dipe)}
.urow .sub{font:400 12px/20px var(--font);color:var(--grey)}
.urow .sub.e{color:var(--red)}
.urow .del{cursor:pointer;display:flex}
.ufoot{display:flex;justify-content:space-between;align-items:center;padding-top:20px}

/* spinner progress */
.ring{width:80px;height:80px;position:relative;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}

/* description list */
.dl{display:grid;grid-template-columns:235px 1fr;column-gap:30px;row-gap:22px;font-size:14px}
.dl dt{color:var(--grey)}
.dl dd{margin:0}

/* spacing page */
.scale td .bar{height:14px;background:#F9D3D6;border-radius:2px}
.gridviz{display:grid;grid-template-columns:70px repeat(4,1fr) 70px;gap:0;height:120px;border-radius:8px;overflow:hidden;font-size:11px;color:var(--grey)}
.gridviz div{display:flex;align-items:center;justify-content:center}
.gridviz .m{background:#F9D3D6}
.gridviz .c{background:#ECE6F8;border-left:15px solid #F9D3D6;border-right:15px solid #F9D3D6}
.gridviz .c:first-of-type{border-left:0}

/* colors */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.swatch{border-radius:14px;overflow:hidden;border:1px solid var(--dividers);cursor:pointer;background:#fff;text-align:left;padding:0;font:inherit;color:inherit}
.swatch .c{height:96px}
.swatch .t{padding:14px}
.swatch .t b{display:block;font-weight:500}
.swatch .t span{color:var(--grey);font-size:12px}
.swatch:hover{border-color:var(--input)}

.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px}
.ovcard{border:1px solid var(--dividers);border-radius:14px;overflow:hidden;transition:box-shadow .2s,transform .2s;background:#fff;display:flex;flex-direction:column}
.ovcard>.ovp{flex:1}
.ovcard:hover{box-shadow:0 10px 30px rgba(16,39,61,.10);transform:translateY(-2px)}
.ovt{display:flex;padding:20px;border-bottom:1px solid var(--dividers);text-decoration:none;font:400 16px/24px var(--font);color:var(--dipe)}
.ovt:hover{color:var(--grey)}
.ovp{min-height:150px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:20px;overflow:hidden}
.note{background:#FFF8E6;border-radius:14px;padding:14px 20px;font-size:14px;margin:20px 0}

@media (max-width:1100px){.toc{display:none}}
@media (max-width:860px){
  .side{transform:translateX(-100%);transition:.2s;box-shadow:0 10px 30px rgba(16,39,61,.12)}
  .side.open{transform:none}
  .main{margin-left:0}
  .burger{display:inline-flex;align-items:center;justify-content:center}
  .wrap{padding:30px 20px 70px}
  .top{padding:0 20px}
  .demos,.do-dont,.cards{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;row-gap:6px}
  .hdr nav{display:none}
}
</style>
</head>

let __m=0;
function ic(n,s=16,c){
  if(n==='search')return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="${c||'#818E99'}" stroke-width="2" fill="none"/><path d="M15.5 15.5l5 5" stroke="${c||'#818E99'}" stroke-width="2" stroke-linecap="round"/></svg>`;
  const k=KIT[n];if(!k)return '';
  let svg=k[1];if(c&&k[0])svg=svg.split(k[0]).join(c);
  const vb=svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/),w=+vb[1],h=+vb[2];
  const W=w>=h?s:+(s*w/h).toFixed(2),H=h>=w?s:+(s*h/w).toFixed(2);
  if(svg.includes('mPH')){__m++;svg=svg.split('mPH').join('mPH'+__m);}
  return svg.replace('<svg ',`<svg class="ic" width="${W}" height="${H}" aria-hidden="true" fill="none" `);
}


/* ---------- helpers ---------- */
const FIG='https://www.figma.com/design/gTbx896Wc9wbkWlf9oXSKx/Potok-%E2%80%94-ui-kit?node-id=';
const box=(stage,title,desc,cls='')=>`<div class="box"><div class="stage ${cls}">${stage}</div><div class="cap"><b>${title}</b><span>${desc||''}</span></div></div>`;
const rule=(good,stage,title,txt)=>`<div class="rule ${good?'good':'bad'}"><div class="stage">${stage}</div><div class="txt"><b>${good?'✓ так':'✕ не так'} — ${title}</b>${txt||''}</div></div>`;
const spec=(head,rows)=>`<div class="tablebox"><table class="spec"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const meta=(node,extra='')=>`<div class="meta"><a class="lnk" href="${FIG}${node}" target="_blank" rel="noopener">открыть в фигме →</a>${extra}</div>`;
const sw=(n,hex)=>`<button class="swatch" data-copy="${hex}"><div class="c" style="background:${hex};${hex==='#FFFFFF'?'border-bottom:1px solid #E8ECF0':''}"></div><div class="t"><b>${n}</b><span>${hex}</span></div></button>`;
const dayCell=(n,st)=>n?`<span class="dd8 ${st||''}" data-d="${n}"><span class="band"></span><span class="d">${n}</span></span>`:`<span class="dd8 e"></span>`;
const rangeState=(n,col,a,b)=>{if(n===a&&n===b)return 'sel';if(n===a)return 'sel st';if(n===b)return 'sel en';if(n>a&&n<b)return col===0?'rs':col===6?'re':'mid';return ''};
const gridHTML=(o)=>{let w='';for(let r=0;r<5;r++){w+='<div class="wk">';for(let c=0;c<7;c++){const n=r*7+c+1;if(n>31){w+=dayCell(0);continue}let st='';if(o.mode==='range')st=rangeState(n,c,o.a,o.b);else if(n===o.a)st='sel';if(!st&&n===27)st='today';w+=dayCell(n,st)}w+='</div>'}return w};
const dp=(o={})=>{o=Object.assign({mode:'single',a:10,b:24,years:false,btns:true},o);
 const yrs=o.years?`<div class="yrs" data-group>${[2023,2022,2021,2020].map(y=>`<span class="yr ${y===2021?'on':''}">${y}</span>`).join('')}</div>`:'';
 const dates=o.mode==='range'?`<div class="dates"><div class="field m nolbl"><input class="inp" value="10.06.2022"></div><span class="dash"></span><div class="field m nolbl"><input class="inp" value="24.06.2022"></div></div><span style="height:4px"></span>`:'';
 return `<div class="dp" data-mode="${o.mode}" data-a="${o.a}" data-b="${o.b}"><div class="body"><div class="calw">${dates}<div class="hdr2"><button aria-label="назад">${ic('arrow8',8)}</button><span>июль, 2022</span><button aria-label="вперед" style="transform:scaleX(-1)">${ic('arrow8',8)}</button></div><div class="grid">${gridHTML(o)}</div></div>${yrs}</div>${o.btns?`<div class="btns"><button class="btn secondary">применить</button><button class="btn tertiary">сбросить</button></div>`:''}</div>`;};
/* ---------- pages ---------- */
const P=[];
const page=(id,group,title,html,en)=>P.push({id,group,title,html,en:en||''});

page('intro','начало','о ките',()=>`
<h1>Поток ui kit</h1>
<p class="lead">единая библиотека интерфейса Потока: цвета, типографика, отступы и компоненты. сайт — для разработчиков и менеджеров: здесь видно, как выглядит каждый компонент, в каких состояниях он бывает, когда его использовать и чего делать нельзя.</p>
${meta('0-1')}
<h2 id="how">как пользоваться</h2>
<div class="cards">
  <a class="card" href="#colors"><div class="h2">основы</div><div class="grey">цвета, шрифты, отступы и сетка — значения, которые используем во всех макетах</div></a>
  <a class="card" href="#overview"><div class="h2">компоненты</div><div class="grey">кнопки, поля, таблицы, уведомления — с состояниями и правилами</div></a>
  <a class="card" href="#tokens"><div class="h2">токены</div><div class="grey">css-переменные для разработки — скопировать одной кнопкой</div></a>
</div>
<h2 id="principles">главные принципы</h2>
<h3>1. маленькая буква</h3>
<p>почти все тексты в Потоке набираются с маленькой буквы — заголовки, кнопки, пункты меню. исключения описаны на странице <a href="#typography">типографика</a>.</p>
<h3>2. близость</h3>
<p>чем теснее элементы связаны по смыслу, тем меньше между ними расстояние. используем только значения из шкалы отступов: 6, 8, 10, 14, 20, 30, 50, 70, 100. подробнее — <a href="#spacing">отступы и сетка</a>.</p>
<h3>3. показываем ошибку, а не блокируем</h3>
<p>по возможности не используем неактивные кнопки — лучше показать пользователю, что именно нужно исправить.</p>
<h2 id="for">кому что смотреть</h2>
${spec(['роль','что смотреть'],[
 ['разработчик','<a href="#tokens">токены</a>, спецификации размеров в каждом компоненте, состояния (hover, active, error, disabled)'],
 ['менеджер / аналитик','разделы «когда использовать» и «правила» — чтобы ставить задачи в терминах кита'],
 ['дизайнер','фигма-ссылки на каждой странице, правила отступов и типографики']])}
`);

page('spacing','основы','отступы и сетка',()=>{
 const sc=[[6,'внутри мелких элементов','иконка и текст в чипе, плашке аккаунта'],[8,'иконка и текст в ссылке','«контакты ˅», «смотреть все →»'],[10,'внутри кнопок и полей','иконка и текст в кнопке, подпись и поле'],[14,'строки внутри группы','строки списка данных, иконка и текст в пункте меню'],[20,'внутри карточки','отступ карточки, между блоками в карточке, элементы в шапке'],[30,'между карточками','колонки сетки, заголовок раздела → контент, кнопка от низа карточки'],[50,'поля шапки','слева и справа в хедере'],[70,'поля страницы','контент 1140 при ширине 1280'],[100,'между разделами','«лучшие предложения», «портфель потока», «пульс потока»']];
 return `
<h1>отступы и сетка</h1>
<p class="lead">правила выведены из наших макетов (рабочий стол инвестора). главная идея — близость: чем теснее элементы связаны по смыслу, тем меньше между ними расстояние. так экран читается группами, а не набором отдельных элементов.</p>
${meta('459-2277')}
<h2 id="scale">шкала отступов</h2>
<p class="grey">используем только эти значения. каждый следующий уровень — для более крупной и менее связанной группы.</p>
${spec(['px','','где','примеры'],sc.map(([v,a,b])=>[`<b>${v}</b>`,`<div class="bar" style="width:${v}px;height:14px;background:#F9D3D6;border-radius:2px"></div>`,a,`<span class="grey">${b}</span>`]))}
<h2 id="levels">уровни близости</h2>
<p>отступ растёт вместе с уровнем: элемент → группа → карточка → раздел. соседние уровни должны заметно отличаться, поэтому шаги идут 14 → 20 → 30 → 100.</p>

 stepper:`<div class="kstepper" style="width:auto"><div class="kst on"><div class="row"><span class="cir">1</span>шаг</div><div class="con"><i></i></div></div><div class="kst"><div class="row"><span class="cir">2</span>шаг</div></div></div>`,
 pagination:`<span class="pgn on">3</span><span class="pgn">4</span><span class="pgn">5</span>`,
 tooltip:`<span class="tip r" style="margin-right:120px">${ic('question',16)}<span class="bub show">текст подсказки</span></span>`,
 notifications:`<div class="nt err" style="width:210px"><div class="cnt"><span class="ic">${ic('warning',24,C.red)}</span><span>у вас просрочка</span></div></div>`,
 modal:`<div style="zoom:.45"><div class="mdl" style="width:432px;box-shadow:0 0 0 2px var(--dividers)"><div class="t">задание создано</div><div class="b1" style="margin-top:20px">задание на покупку Инвестиций по заявке <span style="color:#04CCD9">3990</span> успешно зарегистрировано</div><button class="btn primary" style="margin-top:34px;min-width:0">понятно</button></div></div>`,
 icons:`${ic('info',20)}${ic('lock',20)}${ic('star',20)}${ic('bell',20)}${ic('gift',20)}`
};
page('overview','начало','обзор компонентов',()=>{
 const groups={};P.filter(p=>PV[p.id]).forEach(p=>(groups[p.group]=groups[p.group]||[]).push(p));
 const n=Object.values(groups).reduce((a,b)=>a+b.length,0);
 return `<h1>обзор компонентов</h1>
<p class="lead">все компоненты Потока на одной странице. превью живые — можно покликать прямо здесь, а по названию открыть страницу компонента с состояниями и правилами.</p>
<label class="search" style="max-width:340px">${ic('search',16)}<input id="ovq" placeholder="найти компонент"></label>
${Object.entries(groups).map(([g,ps])=>`<h2 id="g-${ps[0].id}">${g} <span class="grey" style="font-weight:400;font-size:14px">${ps.length}</span></h2>
<div class="ovgrid">${ps.map(p=>`<div class="ovcard" data-t="${(p.title+' '+p.id).toLowerCase()}"><a class="ovt" href="#${p.id}">${p.title} →</a><div class="ovp">${PV[p.id]}</div></div>`).join('')}</div>`).join('')}`;
});
// put overview right after intro
P.splice(1,0,P.pop());

/* ---------- render ---------- */
const side=document.getElementById('side'),content=document.getElementById('content'),toc=document.getElementById('toc');
function buildMenu(filter=''){
  const f=filter.trim().toLowerCase();let h='',g='',n=0;
  P.forEach(p=>{
    if(f&&!(p.title+' '+p.id+' '+p.group).toLowerCase().includes(f))return;
    if(p.group!==g){g=p.group;h+=`<div class="grp">${g}</div>`;}
    h+=`<a href="#${p.id}" data-id="${p.id}">${p.title}</a>`;n++;
  });
  side.innerHTML=h||'<div class="none">ничего не найдено</div>';
  mark();
}
function cur(){const id=location.hash.slice(1);return P.find(p=>p.id===id)||null}
function mark(){const p=cur()||P[0];side.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id===p.id))}
function render(){
  const hash=location.hash.slice(1);let p=P.find(x=>x.id===hash);
  if(!p){ // anchor inside current page
    const el=hash&&document.getElementById(hash);if(el){el.scrollIntoView({behavior:'smooth'});return;}
    p=P[0];
  }
  document.querySelector('.wrap').classList.toggle('notoc',p.id==='header');
  content.innerHTML=p.html();
  document.title=p.title+' — Поток ui kit';
  const hs=[...content.querySelectorAll('h2[id]')];
  toc.innerHTML=hs.length?`<div>на этой странице</div>`+hs.map(h=>`<a href="#${h.id}" data-anchor="${h.id}">${h.textContent}</a>`).join(''):'';
  mark();window.scrollTo(0,0);side.classList.remove('open');
  wire();
}
toc.addEventListener('click',e=>{const a=e.target.closest('a[data-anchor]');if(!a)return;e.preventDefault();document.getElementById(a.dataset.anchor).scrollIntoView({behavior:'smooth'})});
document.getElementById('burger').onclick=()=>side.classList.toggle('open');
window.addEventListener('hashchange',render);

const toastEl=document.getElementById('toast');let tt;
function toast(t,ms=1800){toastEl.innerHTML=t;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),ms)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('скопировано: '+(t.length>30?'css-токены':t))}catch(e){toast('не удалось скопировать — выделите текст вручную')}}

function wire(){
  content.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
  content.querySelectorAll('[data-copy-code]').forEach(b=>b.onclick=()=>copy(document.getElementById('code').textContent));
  content.querySelectorAll('[data-group]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button,.yr');if(!b||!g.contains(b))return;[...g.children].forEach(c=>c.classList.remove('on'));b.classList.add('on')}));
  content.querySelectorAll('[data-group-a]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('a');if(!b)return;g.querySelectorAll('a').forEach(c=>c.classList.remove('on'));b.classList.add('on')}));
  content.querySelectorAll('[data-groupa]').forEach(g=>g.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;g.querySelectorAll('a').forEach(x=>x.classList.remove('on'));a.classList.add('on')}));
  content.querySelectorAll('[data-steps]').forEach(g=>g.addEventListener('click',e=>{const k=e.target.closest('.kst');if(!k)return;g.querySelectorAll('.kst').forEach(x=>x.classList.remove('on'));k.classList.add('on')}));
  content.querySelectorAll('[data-pg]').forEach(g=>{const ps=[...g.querySelectorAll('.pgn')];const set=k=>{ps.forEach((p,j)=>p.classList.toggle('on',j===k))};const cur=()=>ps.findIndex(p=>p.classList.contains('on'));ps.forEach((p,k)=>p.onclick=()=>set(k));g.querySelector('[data-prev]').onclick=()=>set(Math.max(0,cur()-1));g.querySelector('[data-next]').onclick=()=>set(Math.min(ps.length-1,cur()+1))});
  content.querySelectorAll('.pshex .psh').forEach(p=>{p.style.cursor='pointer';p.onclick=e=>{if(e.target.closest('button'))return;const c=p.cloneNode(true);c.classList.add('psh-live');document.body.appendChild(c);requestAnimationFrame(()=>c.classList.add('show'));setTimeout(()=>{c.classList.remove('show');setTimeout(()=>c.remove(),300)},3000)}});
  content.querySelectorAll('.nt .x').forEach(x=>x.onclick=()=>{const n=x.closest('.nt');n.style.display='none';setTimeout(()=>n.style.display='',1500)});
  content.querySelectorAll('[data-multi]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(b)b.classList.toggle('on')}));
  content.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{if(b.dataset.busy)return;b.dataset.busy=1;const t=b.innerHTML,w=b.offsetWidth;b.style.width=w+'px';b.classList.add('busy');b.innerHTML='<span class="spin" style="color:#fff;border-color:rgba(255,255,255,.3);border-top-color:#fff"></span>';setTimeout(()=>{b.classList.remove('busy');b.innerHTML=t;b.style.width='';delete b.dataset.busy},1500)});
  content.querySelectorAll('[data-push]').forEach(b=>b.onclick=()=>toast('<div>ваш счет пополнен</div><div style="font:500 16px/24px var(--font)">+ 300 000 ₽</div>',3000));
  content.querySelectorAll('.dp').forEach(d=>{const g=d.querySelector('.grid');let pick=0;g.addEventListener('click',e=>{const c=e.target.closest('.dd8[data-d]');if(!c)return;const n=+c.dataset.d;
    if(d.dataset.mode==='range'){if(!pick){d.dataset.a=n;d.dataset.b=n;pick=1}else{let a=+d.dataset.a;if(n<a){d.dataset.b=a;d.dataset.a=n}else d.dataset.b=n;pick=0}}else d.dataset.a=n;
    g.innerHTML=gridHTML({mode:d.dataset.mode,a:+d.dataset.a,b:+d.dataset.b});
    const fmt=x=>String(x).padStart(2,'0')+'.06.2022';const ins=d.querySelectorAll('.dates input');if(ins.length){ins[0].value=fmt(d.dataset.a);ins[1].value=fmt(d.dataset.b)}})});
  content.querySelectorAll('.field.m input').forEach(inp=>{const f=inp.closest('.field');const u=()=>f.classList.toggle('has',!!inp.value);inp.addEventListener('input',u)});
  content.querySelectorAll('.field.sel').forEach(f=>{const inp=f.querySelector('input');const arr=f.querySelector('.after');
    const set=(o)=>{f.classList.toggle('open',o);if(!f.classList.contains('m'))inp.classList.toggle('act',o);if(arr)arr.innerHTML=ic(o?'up':'down',16)};
    inp.addEventListener('click',e=>{e.stopPropagation();set(!f.classList.contains('open'))});
    f.querySelectorAll('.ddl a').forEach(a=>a.addEventListener('click',e=>{e.stopPropagation();inp.value=a.textContent;f.classList.add('has');f.querySelectorAll('.ddl a').forEach(x=>x.classList.remove('on'));a.classList.add('on');set(false)}));
  });
  document.onclick=()=>content.querySelectorAll('.field.sel.open').forEach(f=>{if(!f.closest('.tall')){f.classList.remove('open')}});
  content.querySelectorAll('.code').forEach(c=>{const ins=[...c.querySelectorAll('input')];ins.forEach((x,k)=>x.addEventListener('input',()=>{if(x.value&&ins[k+1])ins[k+1].focus()}))});
  const ovq=document.getElementById('ovq');
  if(ovq)ovq.oninput=()=>{const f=ovq.value.trim().toLowerCase();content.querySelectorAll('.ovcard').forEach(c=>c.style.display=!f||c.dataset.t.includes(f)?'':'none');content.querySelectorAll('.ovgrid').forEach(g=>{const vis=[...g.children].some(c=>c.style.display!=='none');g.style.display=vis?'':'none';g.previousElementSibling.style.display=vis?'':'none'})};
  const ovs=document.getElementById('ovs');
  if(ovs){const r=ovs.querySelector('input');r.oninput=()=>{ovs.querySelector('.fill').style.width=r.value+'%';ovs.querySelector('.kn').style.left=r.value+'%'}}
  // slider 1
  const s1=document.getElementById('sl1');
  if(s1){const r=s1.querySelector('input'),f=s1.querySelector('.fill'),k=s1.querySelector('.kn');const u=()=>{const p=(r.value-1)/23*100;f.style.width=p+'%';k.style.left=p+'%'};r.oninput=u;u();}
  const s2=document.getElementById('sl2');
  if(s2){const vals=[6,9,12,18,24,36],r=s2.querySelector('input'),t=s2.querySelector('.trk'),f=s2.querySelector('.fill'),l=s2.querySelector('.lbls');
    t.insertAdjacentHTML('beforeend',vals.map((v,i)=>`<span class="pt" style="left:${i/5*100}%"></span>`).join('')+'<span class="kn"></span>');
    l.innerHTML=vals.map(v=>`<span>${v}</span>`).join('');
    const u=()=>{const i=+r.value,p=i/5*100;f.style.width=p+'%';t.querySelector('.kn').style.left=p+'%';t.querySelectorAll('.pt').forEach((x,j)=>x.classList.toggle('on',j<=i));l.querySelectorAll('span').forEach((x,j)=>x.classList.toggle('on',j===i));document.getElementById('sl2v').textContent=vals[i]+' месяцев'};r.oninput=u;u();}
  // progress ring animation
  const rd=document.getElementById('ringdemo');
  if(rd){const c=rd.querySelector('.rp'),v=rd.querySelector('.rv'),L=parseFloat(c.getAttribute('stroke-dasharray'));let p=10;clearInterval(window.__ri);window.__ri=setInterval(()=>{if(!document.body.contains(rd))return clearInterval(window.__ri);p=p>=100?0:p+3;c.setAttribute('stroke-dashoffset',L*(1-p/100));v.textContent=p+'%'},120);}
}
buildMenu();render();
</script>
</body>
</html>
